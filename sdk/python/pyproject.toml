[project]
name = "traceable-agent-protocol"
version = "0.1.0"
description = "Traceable Agent Protocol (TAP) SDK — sign and verify agent provenance (passports, events, decisions)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TAP contributors" }]
keywords = ["ai-agents", "provenance", "audit", "ed25519", "tap", "mcp", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=44",
    "jcs>=0.2.1",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = ["httpx>=0.27", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/OWNER/tap"
Specification = "https://github.com/OWNER/tap/blob/main/TAP-spec-v0.1.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap_sdk"]
